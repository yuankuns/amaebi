[package]
name = "amaebi"
version = "2026.7.1"
edition = "2021"

[[bin]]
name = "amaebi"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.39", features = ["bundled"] }
tiktoken-rs = "0.9"
agent-client-protocol = "0.10.2"
tokio-util = { version = "0.7", features = ["compat"] }
fs2 = "0.4"
libc = "0.2"
termimad = "0.34"
ratatui = "0.30"
# `event-stream` adds an async stream of terminal events, so the TUI chat
# loop (src/tui.rs) can select! between keyboard input and daemon frames
# without blocking the runtime on raw-mode polling.
crossterm = { version = "0.29", features = ["event-stream"] }
# Used by the TUI input box (src/tui.rs) to compute terminal-column
# width of multi-byte input — CJK / fullwidth / emoji glyphs occupy
# two columns in a terminal but one Unicode scalar each, so cursor
# positioning needs the column count, not the char count.  Pinned to
# 0.2 to match the major used by ratatui (so cell-width math agrees
# with how ratatui renders).  Cargo.lock still resolves a separate
# 0.1 copy for rustyline + termimad — pulling those forward would
# need upstream releases first; the duplicate is harmless.
unicode-width = "0.2"
rustyline = "14"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
serial_test = "3"
axum = "0.7"
tokio-stream = "0.1"
bytes = "1"
